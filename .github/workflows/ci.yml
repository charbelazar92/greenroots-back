# Objectif de ce workflow
# - Vérifier le TypeScript
# - Lancer les tests unitaires
# Render ne déploie que si ce workflow est vert ("After CI Checks Pass")

# Nom du workflow (affiché sur GitHub)
name: Run tests on API

# Événements qui déclenchent le workflow
on:
  push: # Un push ou un merge sur main déclenche le workflow
    branches:
      - main
  pull_request: # Une PR vers main déclenche le workflow
    branches:
      - main

jobs:
  run_api_tests:
    runs-on: ubuntu-latest

    # Valeurs factices : les tests unitaires n'utilisent ni la vraie base
    # ni Supabase, mais le code a besoin que ces variables existent
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/ci
      SUPABASE_URL: https://exemple.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: cle-factice-pour-la-ci
      JWT_SECRET: secret-factice-pour-la-ci-uniquement
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      # Récupérer le code du dépôt dans le runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Mettre en place Node.js
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installer les dépendances (npm ci respecte le package-lock.json)
      - name: Install dependencies
        run: npm ci

      # Générer le client Prisma
      - name: Generate Prisma Client
        run: npm run db:generate

      # Vérifier le TypeScript
      - name: Typecheck
        run: npm run typecheck

      # Exécuter les tests unitaires
      - name: Run unit tests
        run: npm run test:unit